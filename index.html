<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Log</title>
<meta name="description" content="Trainingskalender für Push/Pull/Beine/Ganzkörper mit Übungskatalog, Gewichtsverlauf und Notizen.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:dark}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* status bar band: content scrolls under it, never behind the clock */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
@media (display-mode: standalone) and (prefers-color-scheme: light){body::before{background:#000}}
</style>
<style>
/* Layout: one phone column; the month calendar is the hero card, stats and history stack below; a bottom sheet logs a day. */
:root{
  --bg:#000; --card:#1c1c1e; --card-2:#2a2a2d; --line:#38383c;
  --fg:#f5f5f7; --muted:#9a9aa0; --dim:#5d5d63;
  --accent:#f0612d; --accent-soft:#f6b48f; --accent-ink:#fff;
  --pull:#4fb3c9; --legs:#b48cf2; --full:#e9c43f; --good:#4cd07a;
  --day-off:#48484c; --day-off-fg:#a3a3a8; --eq:#5a5a60; --pic-bg:#232326;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f2f4; --card:#fff; --card-2:#f0eff2; --line:#e2e1e6;
  --fg:#141416; --muted:#6c6b72; --dim:#a9a8ae;
  --accent:#e8551f; --accent-soft:#f3a77f; --accent-ink:#fff;
  --pull:#1f8aa3; --legs:#7d55c7; --full:#b8890b; --good:#1f9e4f;
  --day-off:#e4e3e8; --day-off-fg:#8a8990; --eq:#b9b8bf; --pic-bg:#f7f6f9;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f2f4; --card:#fff; --card-2:#f0eff2; --line:#e2e1e6;
  --fg:#141416; --muted:#6c6b72; --dim:#a9a8ae;
  --accent:#e8551f; --accent-soft:#f3a77f; --accent-ink:#fff;
  --pull:#1f8aa3; --legs:#7d55c7; --full:#b8890b; --good:#1f9e4f;
  --day-off:#e4e3e8; --day-off-fg:#8a8990; --eq:#b9b8bf; --pic-bg:#f7f6f9;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
button,.inp{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
button:active:not(:disabled){opacity:.75}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-inline:2px}
.top h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px}
.sync{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border-radius:22px;padding:18px}
.eyebrow{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:600;font-size:17px}
.eyebrow svg{width:18px;height:18px;flex:none}
.headline{font-weight:700;font-size:21px;line-height:1.25;margin:10px 0 14px;text-wrap:balance}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-left:auto;gap:4px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--card-2);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;justify-items:center}
.cal-head{border-block:1px solid var(--line);padding-block:9px;margin-bottom:12px;color:var(--muted);font-size:15px}
.day{width:min(44px,11vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:clamp(17px,4.6vw,21px);line-height:1;padding:0;text-align:center;font-variant-numeric:tabular-nums;background:var(--day-off);color:var(--day-off-fg);position:relative;transition:transform .12s}
@media (hover:hover){.day:hover:not(:disabled){transform:scale(1.06)}}
.day:active:not(:disabled){transform:scale(.94)}
.day.on{background:var(--accent);color:var(--accent-ink)}
.day.today{box-shadow:0 0 0 3px var(--accent-soft) inset}
.day.on.today{box-shadow:0 0 0 3px var(--accent-soft)}
.day.future{background:transparent;color:var(--dim);cursor:default}
.day .tag{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}
.blank{width:44px}
.cal-foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;color:var(--muted);font-size:12px}
.lg{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.t-push{background:var(--accent)} .t-pull{background:var(--pull)} .t-legs{background:var(--legs)} .t-full{background:var(--full)} .t-none{background:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:600}
.pips{display:flex;gap:5px;margin-top:10px}
.pip{flex:1;height:7px;border-radius:4px;background:var(--card-2)}
.pip.on{background:var(--accent)}
.statline{color:var(--muted);font-size:13px;margin-top:8px}
.next-type{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin-top:6px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:600;background:var(--card-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.danger{background:transparent;color:#ff6b5e;border:1px solid var(--line)}
.next .btn{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-h h2{margin:0;font-size:19px;font-weight:700}
.prog{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 74px auto;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pname{font-weight:600;min-width:0;line-height:1.3}
.pmeta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.delta{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
.delta.up{color:var(--good)} .delta.flat{color:var(--muted)} .delta.down{color:#ff6b5e}
.spark{width:74px;height:28px;display:block}
.empty{color:var(--muted);font-size:14px;padding-block:6px}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.hrow:first-child{border-top:0}
.hrow .d{font-family:var(--display);font-weight:600;font-size:18px;width:62px;font-variant-numeric:tabular-nums;color:var(--muted)}
.hrow .n{flex:1;min-width:0;font-weight:600}
.hrow .c{color:var(--muted);font-size:13px}
.import{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--line);background:transparent}
.import p{margin:0;color:var(--muted);font-size:14px}
.bk-intro{margin:0 0 12px}
.bk-row{display:flex;flex-wrap:wrap;gap:8px}
.bk-box{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bk-box textarea{resize:vertical;font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.35}
#bkMsg:empty{display:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sh-head h3{margin:0;font-size:19px;flex:1;min-width:0}
.sh-body{overflow-y:auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sh-foot{display:flex;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sh-foot .primary{flex:1}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.type{border:2px solid transparent;background:var(--card-2);border-radius:16px;padding:10px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-width:0}
.type b{font-family:var(--display);font-size:19px;line-height:1.05;font-weight:700;text-align:center;width:100%;text-wrap:balance}
.type.sel{border-color:var(--accent)}
.type .rec{display:block;align-self:center;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 7px 0 calc(7px + .06em);border-radius:8px;white-space:nowrap;text-align:center}
.type .rec.ghost{visibility:hidden}
.center{text-align:center;align-self:center}
.btn,.chip,.linkbtn{text-align:center;justify-content:center}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-h b{flex:1;min-width:0}
.ex-no{width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.ex-ctl{display:flex;gap:4px;flex:none}
.mini{width:30px;height:30px;border-radius:9px;border:0;background:var(--card);color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.mini svg{width:15px;height:15px}
.mini:disabled{opacity:.3;cursor:default}
.mini:hover:not(:disabled){color:var(--fg)}
.adder{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.libhead{display:flex;align-items:center;gap:10px}
.libhead b{flex:1;font-size:16px}
.librow{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px 30px;gap:6px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.ex{background:var(--card-2);border-radius:16px;padding:12px}
.ex-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-h b{font-size:15.5px;min-width:0}
.last{font-size:12.5px;color:var(--muted);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.last strong{color:var(--fg);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:44px 1fr 18px 1fr;align-items:center;gap:6px}
.set .n{color:var(--muted);font-size:12px}
.set .x{color:var(--dim);text-align:center}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 10px;font:inherit;font-variant-numeric:tabular-nums;font-size:16px}
.inp::placeholder{color:var(--dim)}
.inwrap{position:relative}
.inwrap em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--dim);pointer-events:none}
.ex-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.addex{display:flex;gap:8px}
.pg-floor{stroke:var(--line);stroke-width:1}
.pg-eq{fill:var(--eq)}
.pg-frame{stroke:var(--eq);stroke-width:2.6;stroke-linecap:round}
.pg-cable{stroke:var(--muted);stroke-width:.9}
.pg-gap{stroke:var(--pic-bg);stroke-width:.8}
.pg-limb{stroke:var(--fg);stroke-width:3.2;stroke-linecap:round}
.pg-torso{stroke-width:3.8}
.pg-far{opacity:.4}
.pg-head{fill:var(--fg)}
.pg-plate{fill:var(--accent)}
.pg-bar{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round}
.pic{display:block;width:100%;height:auto;aspect-ratio:4/3;background:var(--pic-bg);border-radius:12px}
.pic.sm{width:64px;flex:none;border-radius:10px}
.pic.xs{width:36px;flex:none;border-radius:7px}
.ex-h{align-items:center}
.ex-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ex-t .ex-no{width:auto;height:auto;background:none;display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ex-t b{font-size:15.5px;line-height:1.25}
.ex-tag{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px}
.catbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;background:var(--card-2);border:1px solid var(--line)}
.catbtn svg{width:16px;height:16px;color:var(--accent)}
.catbtn small{color:var(--muted);font-weight:500;font-size:12.5px}
.filters{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.filter.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:440px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;border:2px solid transparent;background:var(--card-2);border-radius:16px;padding:6px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.tile .pic{background:var(--pic-bg)}
.tile b{font-size:13px;line-height:1.25;font-weight:600;text-wrap:balance;padding-inline:2px}
.tile span:last-child{font-size:11.5px;color:var(--muted)}
.tile.sel{border-color:var(--accent)}
.tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--muted);z-index:1}
.tick svg{width:12px;height:12px}
.tile.sel .tick{background:var(--accent);color:var(--accent-ink)}
.librow{grid-template-columns:36px minmax(0,1fr) 34px 34px 34px}
.mini{width:34px;height:34px}
.linkbtn{min-height:34px;padding:6px 2px}
.ex-actions{gap:14px}
.grab{display:flex;justify-content:center;padding-top:8px;touch-action:none}
.grab span{width:38px;height:5px;border-radius:3px;background:var(--line)}
.sh-head{padding-top:6px;touch-action:none}
.sheet{max-height:calc(100% - 12px - env(safe-area-inset-top,0px))}
.sheet.editing{max-height:none;border-radius:0;transition:none}
.sheet.editing .sh-foot,.sheet.editing .grab{display:none}
.sheet.editing .sh-body{padding-bottom:45vh}
.sheet.editing .sh-head{padding-top:10px}
#shDone{display:none}
.sheet.editing #shDone{display:inline-flex}
.sheet.editing #shClose{display:none}
.note{display:flex;align-items:flex-start;gap:8px;width:100%;margin-top:10px;padding:9px 11px;border:0;border-radius:11px;background:var(--card);color:var(--fg);font-size:13.5px;line-height:1.4;text-align:left}
.note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--accent)}
.note span{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note-edit{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.note-inp{flex:1;resize:none;font-size:16px;line-height:1.4;min-height:62px}
#shCatFoot .primary{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.ex-t b,.tile b,.pname,.chip span{overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.sec-h{flex-wrap:wrap}
.toast{white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.type b{font-size:clamp(15px,4.6vw,19px)}
@media (max-width:360px){.pic.sm{width:48px}.ex-ctl{gap:3px}.mini{width:32px;height:32px}.ex-h{gap:7px}}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app" lang="de">
  <header class="top">
    <div>
      <div class="sub" id="todayLabel"></div>
      <h1>Gym Log</h1>
    </div>
    <div class="sync" id="sync">Lädt…</div>
  </header>

  <section class="card" aria-labelledby="calTitle">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="eyebrow" id="calTitle">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.6 2.2c.5 3-1 4.6-2.5 6.2C8.6 10 7 11.6 7 14.5a5 5 0 0 0 10 0c0-1.6-.6-2.9-1.4-3.9.1 1.4-.5 2.6-1.6 2.9.6-2.6-.2-6.6-1.4-11.3ZM12 22a7.5 7.5 0 0 1-7.5-7.5c0-4 2.3-6.2 3.9-7.9C10 5 11 3.9 10.6 1.5L10.4.2l1.2.5c4.3 1.9 7.9 6.5 7.9 13.8A7.5 7.5 0 0 1 12 22Z"/></svg>
        Trainings
      </div>
      <div class="monthnav">
        <button class="iconbtn" id="prevM" aria-label="Vorheriger Monat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="iconbtn" id="nextM" aria-label="Nächster Monat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>

    else if (t === "S") { out.push(`<rect x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}" rx="1" class="pg-eq"/>`); for (let y = v[1]+4; y < v[1]+v[3]-1; y += 4) out.push(`<line x1="${v[0]}" y1="${y}" x2="${v[0]+v[2]}" y2="${y}" class="pg-gap"/>`); }
    else late.push(e);
  }
  if (f) {
    const g = [], far = [];
    if (f.E2) far.push(ln(f.N,f.E2,"pg-limb"), ln(f.E2,f.W2,"pg-limb"));
    if (f.K2) far.push(ln(f.P,f.K2,"pg-limb"), ln(f.K2,f.F2,"pg-limb"));
    out.push(`<g class="${p.front ? "" : "pg-far"}">${far.join("")}</g>`);
    g.push(ln(f.P,f.K,"pg-limb"), ln(f.K,f.F,"pg-limb"), ln(f.N,f.P,"pg-limb pg-torso"));
    if (f.E) g.push(ln(f.N,f.E,"pg-limb"), ln(f.E,f.W,"pg-limb"));
    g.push(`<circle cx="${f.H[0]}" cy="${f.H[1]}" r="3.6" class="pg-head"/>`);
    out.push(g.join(""));
  }
  for (const [t, ...v] of late) {
    if (t === "P") out.push(`<circle cx="${v[0]}" cy="${v[1]}" r="${v[2]}" class="pg-plate"/>`);
    else if (t === "A") out.push(ln([v[0],v[1]],[v[2],v[3]],"pg-bar"));
    else if (t === "Q") out.push(`<rect x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}" rx="0.8" class="pg-plate"/>`);
  }
  return `<svg class="${cls || "pic"}" viewBox="0 0 64 48" aria-hidden="true">${out.join("")}</svg>`;
}

// Your own exercise lists per training type. Older versions kept only added exercises in settings.custom.
function ensurePlans(){
  if (!settings.plans) {
    const c = settings.custom || {};
    settings.plans = {push:[...(c.push||[])], pull:[...(c.pull||[])], legs:[...(c.legs||[])]};
  }
  if (!Array.isArray(settings.plans.full)) settings.plans.full = FULL_START.map(id => ({id, name: CAT[id].name, pic: CAT[id].pic}));

// one write at a time to the settings doc; rapid changes collapse into the next write
let setSaving = null, setDirty = false;
function saveSettings(){
  lsWrite();
  if (mode !== "cloud") return Promise.resolve();
  if (setSaving) { setDirty = true; return setSaving; }
  setSaving = (async () => {
    do { setDirty = false; try { await coll.doc("settings").set(JSON.parse(JSON.stringify(settings))); } catch(e){ toast("Einstellungen konnten nicht gespeichert werden."); } } while (setDirty);
    setSaving = null;

}

async function connect(){
  lsRead(); render();
  try {
    if (!window.claude || !window.claude.use) throw 0;
    const [dbNs, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!dbNs || !uid) throw 0;
    db = dbNs; coll = db.collection("data/users/" + uid);
    let first = true;
    coll.onSnapshot(snap => {
      const w = {}; let s = null;
      snap.docs.forEach(d => { if (d.id === "settings") s = d.data(); else if (/^\d{4}-\d\d-\d\d$/.test(d.id)) w[d.id] = d.data(); });
      if (first) {
        first = false; mode = "cloud";
        // one-time move of anything saved only in this browser
        const localOnly = Object.keys(workouts).filter(k => !w[k]);
        if (snap.empty && localOnly.length) { localOnly.forEach(k => coll.doc(k).set(workouts[k]).catch(()=>{})); localOnly.forEach(k => w[k] = workouts[k]); if (!s) { coll.doc("settings").set(settings).catch(()=>{}); s = settings; } }
      }
      workouts = JSON.parse(JSON.stringify(w));
      if (s) settings = Object.assign({custom:{push:[],pull:[],legs:[]}, importDone:false}, JSON.parse(JSON.stringify(s)));
      ensurePlans();
      lsWrite(); setSync(); render();
    }, () => { mode = "local"; setSync(); });
  } catch(e) { mode = "local"; setSync(); }
}

// ---------- derived ----------
const sortedDates = () => Object.keys(workouts).sort();
function exercisesFor(type){ return settings.plans[type] || []; }
function exName(id){
  for (const t in settings.plans) for (const e of settings.plans[t]) if (e.id === id) return e.name;
  if (CAT[id]) return CAT[id].name;
  for (const d of sortedDates().reverse()) { const n = workouts[d].names?.[id]; if (n) return n; }
  for (const t in DEFAULT_EX) for (const [i,n] of DEFAULT_EX[t]) if (i === id) return n;
  return id;
}
function lastSets(exId, beforeDate){
  const ds = sortedDates().filter(d => d < beforeDate).reverse();
  for (const d of ds) { const s = workouts[d].sets?.[exId]; if (s && s.length) return {date:d, sets:s}; }
  return null;
}
function recommend(forDate){
  const prev = sortedDates().filter(d => d < forDate && workouts[d].type).map(d => workouts[d]);
  const last = prev[prev.length-1];
  let cands = Object.keys(TYPES).filter(t => !last || t !== last.type);
  const wkStart = key(mondayOf(parse(forDate)));
  const legsThisWeek = prev.some(w => w.type === "legs" && w.date >= wkStart);
  if (legsThisWeek && cands.length > 1) cands = cands.filter(t => t !== "legs");
  const lastDone = t => { for (let i = prev.length-1; i >= 0; i--) if (prev[i].type === t) return prev[i].date; return ""; };
  cands.sort((a,b) => lastDone(a).localeCompare(lastDone(b)));
  const why = [];
  if (last) why.push(`Zuletzt ${TYPES[last.type].name} (${relDay(last.date, forDate)})`);
  if (legsThisWeek) why.push("Beine diese Woche erledigt");
  return {type: cands[0], why: why.join(" · ")};
}
function relDay(d, ref){
  const diff = Math.round((parse(ref) - parse(d)) / 864e5);
  if (diff === 0) return "heute"; if (diff === 1) return "gestern"; if (diff === 2) return "vorgestern";
  return `vor ${diff} Tagen`;
}
function topWeight(sets){ let m = null; (sets||[]).forEach(s => { if (s.w != null && (m == null || s.w > m)) m = s.w; }); return m; }

// ---------- render ----------
function render(){
  $("todayLabel").textContent = `${WD[today.getDay()]}, ${today.getDate()}. ${MONTHS[today.getMonth()]}`;
  renderCal(); renderStats(); renderProgress(); renderHistory();
  
}
function renderCal(){
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const days = new Date(y, m+1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const prefix = `${y}-${pad(m+1)}-`;
  const count = Object.keys(workouts).filter(k => k.startsWith(prefix)).length;
  const isCur = y === today.getFullYear() && m === today.getMonth();
  const mName = MONTHS[m] + (y !== today.getFullYear() ? " " + y : "");
  $("headline").textContent = count
    ? `Du hast ${isCur ? "diesen Monat" : "im " + mName} ${count} ${count === 1 ? "Tag" : "Tage"} trainiert.`
    : (isCur ? "Diesen Monat noch kein Training eingetragen." : `Im ${mName} kein Training eingetragen.`);
  let h = "";
  for (let i = 0; i < lead; i++) h += `<span class="blank"></span>`;
  for (let d = 1; d <= days; d++) {
    const k = prefix + pad(d), w = workouts[k], fut = k > TODAY;
    const cls = ["day", w ? "on" : "", k === TODAY ? "today" : "", fut ? "future" : ""].join(" ");
    const tag = w && w.type ? `<i class="tag ${TYPES[w.type].cls}"></i>` : "";
    const lbl = `${d}. ${MONTHS[m]}${w ? ", " + (w.type ? TYPES[w.type].name : "Training") : ""}`;
    h += `<button class="${cls}" data-day="${k}" ${fut ? "disabled" : ""} aria-label="${lbl}">${d}${tag}</button>`;
  }
  $("cal").innerHTML = h;
  $("nextM").disabled = isCur;
}
function renderStats(){
  const ws = key(mondayOf(today)), we = key(addDays(mondayOf(today), 6));
  const wk = Object.keys(workouts).filter(k => k >= ws && k <= we).length;
  $("weekCount").innerHTML = `${wk}<small> / 5</small>`;
  $("pips").innerHTML = Array.from({length:Math.max(5,wk)}, (_,i) => `<span class="pip ${i < wk ? "on" : ""}"></span>`).join("");
  const mp = TODAY.slice(0,8);
  const mc = Object.keys(workouts).filter(k => k.startsWith(mp));
  const by = {push:0,pull:0,legs:0,full:0}; mc.forEach(k => { const t = workouts[k].type; if (t) by[t]++; });
  $("monthLine").textContent = `${MONTHS[today.getMonth()]}: ${mc.length} Trainings · ${by.push}× Brust, ${by.pull}× Rücken, ${by.legs}× Beine${by.full ? `, ${by.full}× Ganzkörper` : ""}`;
  const doneToday = !!workouts[TODAY];
  const target = doneToday ? key(addDays(today,1)) : TODAY;
  const r = recommend(target);
  $("nextLabel").textContent = doneToday ? "Morgen dran" : "Heute dran";
  $("nextType").textContent = TYPES[r.type].name;

  $("nextGo").textContent = doneToday ? "Heutiges Training ansehen" : "Heute eintragen";

function spark(vals){
  if (vals.length < 2) return `<svg class="spark" aria-hidden="true"></svg>`;
  const W = 74, H = 28, p = 3, mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v,i) => [p + i*(W-2*p)/(vals.length-1), H - p - (v-mn)/rg*(H-2*p)]);
  const line = pts.map(q => q.map(n => n.toFixed(1)).join(",")).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}
function renderProgress(){
  const series = {};
  sortedDates().forEach(d => { const s = workouts[d].sets || {}; for (const id in s) { const t = topWeight(s[id]); if (t != null) (series[id] = series[id] || []).push({d, t}); } });
  const rows = Object.entries(series).sort((a,b) => b[1][b[1].length-1].d.localeCompare(a[1][a[1].length-1].d)).slice(0, 8);
  if (!rows.length) { $("prog").innerHTML = `<p class="empty">Sobald du Gewichte einträgst, siehst du hier, wie du in jeder Übung stärker wirst.</p>`; return; }
  $("prog").innerHTML = rows.map(([id, s]) => {
    const f = s[0].t, l = s[s.length-1].t, dlt = l - f;
    const pct = f > 0 ? Math.round(dlt / f * 100) : 0;
    const cls = s.length < 2 || dlt === 0 ? "flat" : dlt > 0 ? "up" : "down";
    const txt = s.length < 2 ? "neu" : `${dlt > 0 ? "+" : dlt < 0 ? "−" : "±"}${fmtNum(Math.abs(dlt))} kg`;
    return `<div class="prow"><div style="min-width:0"><div class="pname">${esc(exName(id))}</div><div class="pmeta">${fmtNum(f)} → ${fmtNum(l)} kg · ${s.length}× seit ${fmtShort(s[0].d)}${s.length > 1 && pct ? ` · ${pct > 0 ? "+" : ""}${pct} %` : ""}</div></div>${spark(s.map(x => x.t))}<div class="delta ${cls}">${txt}</div></div>`;
  }).join("");
}
function renderHistory(){
  const ds = sortedDates().reverse().slice(0, 6);
  if (!ds.length) { $("hist").innerHTML = `<p class="empty">Noch nichts eingetragen. Tippe im Kalender auf einen Tag.</p>`; return; }
  $("hist").innerHTML = ds.map(d => {
    const w = workouts[d], n = Object.values(w.sets || {}).filter(s => s.length).length;
    return `<button class="hrow" data-day="${d}"><span class="d">${fmtShort(d)}</span><i class="dot ${w.type ? TYPES[w.type].cls : "t-none"}"></i><span class="n">${w.type ? TYPES[w.type].name : "Trainingsart fehlt"}</span><span class="c">${n ? n + (n === 1 ? " Übung" : " Übungen") : ""}</span></button>`;
  }).join("");
}

// ---------- sheet ----------
// ed: {date, type, order:[ids in the order done], sets:{id:[{w,r}]}, exists, view:"log"|"lib"|"cat", catMode:"day"|"plan", catFilter}
let ed = null;
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function openDay(date, presetType){
  const w = workouts[date];
  ed = {date, type: w?.type || presetType || null, exists: !!w, sets: clone(w?.sets || {}), order: [], delArm:false, view:"log", catMode:"day", catFilter:"Alle"};
  for (const id in ed.sets) ed.sets[id] = ed.sets[id].map(s => ({w: s.w == null ? "" : fmtNum(s.w), r: s.r == null ? "" : String(s.r)}));
  ed.order = w?.order ? [...w.order] : Object.keys(ed.sets);

  const s = d.settings || {};
  ensurePlans();
  for (const t in TYPES) for (const e of (s.plans?.[t] || [])) if (e && e.id && e.name && !settings.plans[t].some(x => x.id === e.id)) settings.plans[t].push(e);
  for (const [id, v] of Object.entries(s.notes || {})) if (typeof v === "string" && !settings.notes[id]) settings.notes[id] = v;
  if (s.importDone) settings.importDone = true;
  await saveSettings(); render();
  bkMsg(added || updated ? `Import fertig: ${added} neue und ${updated} aktualisierte Trainings, dazu Übungslisten und Notizen.` : "Import fertig. Alle Trainings waren schon vorhanden; Übungslisten und Notizen wurden ergänzt.");
  toast("Backup importiert");
}

let tt; function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

connect();
})();
</script>

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

</script>
